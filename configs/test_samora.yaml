# SAMora evaluation on Synapse
dataset: Synapse

# choose single-decoder SAMora path
variant: samora
module: samora_lora_sam
vit_name: samora_vit_b

# base SAM checkpoint
ckpt: checkpoints/sam_vit_b_01ec64.pth

# model
rank: 4
use_hl_attn: true
train_prompt_encoder_in_stage2: false
strict_ckpt_loading: false

# pretrained stage1 experts
image_lora_ckpt: checkpoints/stage1/image_expert_epoch_29.pth
patch_lora_ckpt: checkpoints/stage1/patch_expert_epoch_29.pth
pixel_lora_ckpt: checkpoints/stage1/pixel_expert_epoch_29.pth

# stage2 samora checkpoint
lora_ckpt: checkpoints/stage2_samora/epoch_19.pth

# test data
root_path: ../data/Synapse/test_vol_h5
list_dir: ./lists/lists_Synapse
split: test_vol
num_classes: 8
img_size: 224
z_spacing: 1

# runtime
deterministic: true
seed: 1234
n_gpu: 1

# outputs
output_dir: ./test_out/samora
is_savenii: false
